services:
  web:
    volumes:
      - ./frontend/site:/srv/site:ro

  api:
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    environment:
      API_DOCS: "true"
    volumes:
      - ./backend/app:/srv/app
      - ./backend/migrations:/srv/migrations

  db:
    ports:
      - "127.0.0.1:5432:5432"
